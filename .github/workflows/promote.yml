# Promotes the current staging APK to a versioned production release.
# Downloads the APK from the staging pre-release and attaches it to a new GitHub Release.
# Run manually from the GitHub Actions UI or:
#   gh workflow run promote.yml -f version=v1.2.3
#
# Prerequisites:
#   - A staging release must exist (created by staging-build.yml)

name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.2.3)'
        required: true

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download staging APK
        run: |
          gh release download staging \
            --repo ${{ github.repository }} \
            --pattern "app-debug.apk" \
            --output DroidGauntlet.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create production release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          prerelease: false
          files: DroidGauntlet.apk
