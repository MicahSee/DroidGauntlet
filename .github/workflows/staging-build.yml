# Builds the APK and publishes it to the staging GitHub pre-release.
# The staging release acts as the artifact store (analogous to GHCR :staging tag).
# Each push to staging overwrites the release asset with the new APK.

name: Staging Build

on:
  push:
    branches:
      - staging

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Publish to staging release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staging
          name: Staging Build
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
